name: Publish AN5 documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: an5ORM/an5
          ref: main
          path: source
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate stack routes
        working-directory: source
        run: node docs/build-context-pages.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./source/docs
          destination: ./_site
      - name: Check links
        working-directory: source
        run: python3 docs/test/check-links.py ../_site
      - name: Check metadata
        run: node source/scripts/audit-seo.mjs
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
