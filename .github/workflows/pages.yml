name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'scripts/audit-seo.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'scripts/audit-seo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout the matching brand assets
        uses: actions/checkout@v4
        with:
          repository: an5ORM/an5Brand
          ref: 3b2d4b8f49447e8e9d7156454c1ea88f68b3453d
          path: an5Brand

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install brand verification dependencies
        run: npm ci --prefix an5Brand

      - name: Check the .an5 syntax grammar & diagrams
        run: npm run test:docs

      - name: Generate language and provider documentation routes
        run: node docs/build-context-pages.mjs

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Validate Mermaid browser interactions (Mobile & Desktop)
        run: node docs/test/mermaid-browser.mjs

      - name: Validate language and provider chooser
        run: node docs/test/context-browser.mjs

      - name: Run Technical SEO Audit
        run: node scripts/audit-seo.mjs

      - name: Check internal links
        run: python3 docs/test/check-links.py ./_site

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
